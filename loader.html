<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Launcher</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23140a20'/%3E%3Ccircle cx='32' cy='40' r='5' fill='%23ff9a4d'/%3E%3Cpath d='M32 35V14' stroke='%23ff9a4d' stroke-width='3.5' stroke-linecap='round'/%3E%3Cpath d='M20 22a17 17 0 0 1 24 0' stroke='%237ee0b8' stroke-width='3.5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    display: grid; place-items: center;
    background:
      radial-gradient(900px 500px at 50% -10%, #2a1740, transparent 70%),
      linear-gradient(180deg, #1a1030, #0c0614 60%, #170c18);
    color: #f3e9dc;
    font: 15px/1.6 "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, sans-serif;
  }
  .card { width: min(440px, 88vw); text-align: center; }

  h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-style: italic; font-weight: 600;
    font-size: clamp(3rem, 12vw, 4.5rem); line-height: 1;
    margin: 0 0 6px;
    background: linear-gradient(104deg, #fbf1e2 10%, #ffcf9a 46%, #ff8a3c 88%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .sub { color: #b9a6c8; font-size: .95rem; margin: 0 0 32px; }

  button {
    font: inherit; font-weight: 600; font-size: 1rem;
    padding: 15px 40px; border: none; border-radius: 14px;
    background: linear-gradient(180deg, #ffbe6b, #ff9a4d);
    color: #2a1403; cursor: pointer;
    box-shadow: 0 14px 34px -18px #ff9a4d;
    transition: transform .15s, filter .15s;
  }
  button:hover { filter: brightness(1.06); }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: .55; cursor: wait; filter: none; }

  .log {
    margin-top: 20px; min-height: 3.4em;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 12px; color: #9b86a8; line-height: 1.7;
  }
  .log b { color: #7ee0b8; font-weight: 400; }
  .log i { color: #ff8b9a; font-style: normal; }
  .log .step { display: block; }
  .bar {
    height: 2px; margin: 18px auto 0; width: 0;
    background: linear-gradient(90deg, #ff9a4d, #7ee0b8);
    border-radius: 2px; transition: width .45s ease;
  }
  a.alt { color: #c9a7ff; font-size: 12px; }
</style>
</head>
<body>

<div class="card">
  <h1>relay</h1>
  <p class="sub">press to launch</p>
  <button id="go" type="button">Launch</button>
  <div class="bar" id="bar"></div>
  <div class="log" id="log"></div>
</div>

<script>
/* ===========================================================
   Relay launcher
   -----------------------------------------------------------
   Pulls the built single file out of the repo over a CDN and
   writes it into an about:blank window. No GitHub API — these
   are plain file CDNs, no rate limit, no token, no JSON.

   Change these three lines and nothing else.
   =========================================================== */

var USER   = "jace01b-web";
var REPO   = "relay";
var BRANCH = "main";                 /* or a tag: "v1" */
var FILE   = "dist/relay.html";

/* What the launched tab calls itself. Blank keeps Relay's own. */
var TAB_TITLE = "";
var TAB_ICON  = "";

/* Tried in order, first one that answers wins.
   jsDelivr is the CDN, so it is first: cached at the edge, fast,
   and it never counts against anything. The others are the same
   file from different front doors, for when one is blocked. */
var SOURCES = window.RELAY_SOURCES || [
  "https://cdn.jsdelivr.net/gh/" + USER + "/" + REPO + "@" + BRANCH + "/" + FILE,
  "https://fastly.jsdelivr.net/gh/" + USER + "/" + REPO + "@" + BRANCH + "/" + FILE,
  "https://cdn.statically.io/gh/" + USER + "/" + REPO + "/" + BRANCH + "/" + FILE,
  "https://rawcdn.githack.com/" + USER + "/" + REPO + "/" + BRANCH + "/" + FILE,
  "https://raw.githubusercontent.com/" + USER + "/" + REPO + "/" + BRANCH + "/" + FILE
];

var go  = document.getElementById("go");
var log = document.getElementById("log");
var bar = document.getElementById("bar");

function say(html)  { log.innerHTML = html; }
function step(pct)  { bar.style.width = pct + "%"; }

function shortHost(url) {
  try { return new URL(url).hostname.replace(/^cdn\.|^rawcdn\./, ""); }
  catch (e) { return url; }
}

/* A holding page, so the new tab is never a blank white flash */
function holdingPage() {
  return "<!doctype html><html><head><meta charset='utf-8'>" +
    "<title>" + (TAB_TITLE || "New Tab") + "</title>" +
    (TAB_ICON ? "<link rel='icon' href='" + TAB_ICON + "'>" : "") +
    "<style>html,body{margin:0;height:100%;background:#140a20;color:#9b86a8;" +
    "font:14px/1.6 ui-sans-serif,system-ui,sans-serif;display:grid;place-items:center}" +
    "@keyframes p{0%,100%{opacity:.35}50%{opacity:1}}" +
    "div{animation:p 1.4s ease-in-out infinite}</style></head>" +
    "<body><div>loading…</div></body></html>";
}

async function pull(url, signal) {
  var res = await fetch(url, { cache: "no-store", signal: signal });
  if (!res.ok) throw new Error(res.status + " " + res.statusText);
  var text = await res.text();
  /* a CDN that is still warming up can hand back an error page */
  if (!/<html[\s>]/i.test(text) || text.length < 5000) {
    throw new Error("that was not the app (" + text.length + " bytes)");
  }
  return text;
}

async function launch() {
  go.disabled = true;
  step(8);
  say("<span class='step'>opening…</span>");

  /* The window has to be opened inside the click. Open it after an
     await and the pop-up blocker takes it. */
  var win = window.open("about:blank", "_blank");
  if (!win) {
    step(0);
    say("<i>the browser blocked the new tab — allow pop-ups for this page, then press Launch again</i>");
    go.disabled = false;
    return;
  }
  try {
    win.document.open();
    win.document.write(holdingPage());
    win.document.close();
  } catch (e) {}

  var problems = [];
  for (var i = 0; i < SOURCES.length; i++) {
    var url = SOURCES[i];
    var ctrl = typeof AbortController !== "undefined" ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, 15000);

    say("<span class='step'>fetching from " + shortHost(url) + "…</span>" +
        (problems.length ? "<span class='step'><i>" + problems.join("</i><br><i>") + "</i></span>" : ""));
    step(20 + i * 14);

    try {
      var html = await pull(url, ctrl ? ctrl.signal : undefined);
      clearTimeout(timer);
      step(92);

      /* hand the tab the real thing */
      win.document.open();
      win.document.write(html);
      win.document.close();

      if (TAB_TITLE) { try { win.document.title = TAB_TITLE; } catch (e) {} }

      step(100);
      say("<span class='step'><b>launched</b> · " + Math.round(html.length / 1024) +
          " KB from " + shortHost(url) + "</span>");
      go.disabled = false;
      go.textContent = "Launch again";
      return;
    } catch (err) {
      clearTimeout(timer);
      var why = err && err.name === "AbortError" ? "timed out" : (err && err.message) || "failed";
      problems.push(shortHost(url) + " — " + why);
    }
  }

  /* nothing answered */
  step(0);
  try { win.close(); } catch (e) {}
  say("<span class='step'><i>could not reach the app from any source</i></span>" +
      "<span class='step'>" + problems.join("<br>") + "</span>" +
      "<span class='step'>your network may be blocking these CDNs — " +
      "<a class='alt' href='https://" + USER + ".github.io/" + REPO + "/' target='_blank' rel='noreferrer'>" +
      "try the hosted copy</a></span>");
  go.disabled = false;
}

go.addEventListener("click", launch);
window.addEventListener("keydown", function (e) {
  if (e.key === "Enter" && !go.disabled) launch();
});
</script>
</body>
</html>
